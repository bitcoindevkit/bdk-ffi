name: Test Android

# Tests the Android bindings for bdk-ffi on an Android emulator.
# Builds Rust binaries, sets up Android emulator, and runs the connected tests.

on:
  workflow_dispatch:
  push:
    paths:
      - "bdk-ffi/**"
      - "bdk-android/**"
  pull_request:
    paths:
      - "bdk-ffi/**"
      - "bdk-android/**"

permissions: {}

jobs:
  test:
    name: "Test Android library"
    runs-on: ubuntu-24.04

    services:
      bitcoin-regtest:
        image: ghcr.io/thunderbiscuit/podman-regtest-infinity-pro:0.4.0
        ports:
          - 18443:18443
          - 18444:18444
          - 3002:3002
          - 60401:60401
        # The container initialization step will wait until everything is ready before allowing other steps to run
        options: >-
          --health-cmd "test $(bitcoin-cli -regtest -rpcuser=regtest -rpcpassword=password getblockcount) -gt 100"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: "Checkout PR branch"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Set up JDK"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v4

      - name: "Set up Android NDK"
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: "Set up Rust"
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: "Build Android library"
        run: |
          cd bdk-android
          bash ./scripts/release/build-release-linux-x86_64.sh

      - name: "Free Disk Space (Ubuntu)"
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          remove-large-packages: false

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Run Android connected tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot"
          script: cd bdk-android && ./gradlew connectedAndroidTest --console=plain
